[project]
name = "trading-intelligence-api"
version = "0.1.0"
description = "Demo-only Python API for AI Trading Intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
postgres = [
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
]
agents = [
  "langgraph>=0.2,<2.0",
]
ml = [
  "xgboost>=2.1,<4.0",
  "torch>=2.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
